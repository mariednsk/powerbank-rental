components:
  messages:
    RentalCreated:
      name: RentalCreated
      title: RentalCreated
      summary: У аренды появился постоянный идентификатор.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        properties:
          eventId:
            type: string
            description: Постоянный ID публикации; повторы сохраняют его
          eventType:
            type: string
            enum:
            - RentalCreated
          eventVersion:
            type: integer
            const: 1
          rentalId:
            type: string
            description: Корреляционный ID процесса
          occurredAt:
            type: string
            format: date-time
            description: Момент создания события у владельца
          producer:
            type: string
            enum:
            - Rental Service
          data:
            type: object
            additionalProperties: false
            properties:
              userId:
                type: string
              stationId:
                type: string
            required:
            - userId
            - stationId
        required:
        - eventId
        - eventType
        - eventVersion
        - rentalId
        - occurredAt
        - producer
        - data
