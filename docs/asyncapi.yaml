# AsyncAPI 3.0.0 — сводные события вашей системы, брокер Kafka.
asyncapi: 3.0.0
id: urn:powerbank-rental:integration-contracts:v1
info:
  title: Powerbank Rental — Kafka events
  version: 1.0.0
  description: 'Сводный учебный каталог событий и направлений обмена. Каждая операция помечена x-service: send
    означает публикацию ИМЕННО этим сервисом, receive — потребление ИМЕННО этим сервисом. Во второй части его
    можно разнести по отдельным AsyncAPI-документам каждого сервиса.'
defaultContentType: application/json
servers:
  localKafka:
    host: localhost:9092
    protocol: kafka
    description: Учебный локальный брокер; реальная адресация задаётся через окружение
channels:
  rentalCreated:
    address: powerbank.rental.rentalCreated.v1
    description: У аренды появился постоянный идентификатор.
    messages:
      RentalCreated:
        $ref: '#/components/messages/RentalCreated'
  powerbankReserved:
    address: powerbank.inventory.powerbankReserved.v1
    description: Устройство атомарно зарезервировано.
    messages:
      PowerbankReserved:
        $ref: '#/components/messages/PowerbankReserved'
  reservationRejected:
    address: powerbank.inventory.reservationRejected.v1
    description: Свободного исправного устройства нет.
    messages:
      ReservationRejected:
        $ref: '#/components/messages/ReservationRejected'
  reservationReleased:
    address: powerbank.inventory.reservationReleased.v1
    description: Резерв безопасно снят после подтверждённого отсутствия выдачи.
    messages:
      ReservationReleased:
        $ref: '#/components/messages/ReservationReleased'
  paymentAuthorized:
    address: powerbank.payment.paymentAuthorized.v1
    description: Депозит подтверждён провайдером.
    messages:
      PaymentAuthorized:
        $ref: '#/components/messages/PaymentAuthorized'
  paymentAuthorizationFailed:
    address: powerbank.payment.paymentAuthorizationFailed.v1
    description: Провайдер окончательно отказал в блокировке.
    messages:
      PaymentAuthorizationFailed:
        $ref: '#/components/messages/PaymentAuthorizationFailed'
  paymentAuthorizationVoided:
    address: powerbank.payment.paymentAuthorizationVoided.v1
    description: Депозит разблокирован без списания.
    messages:
      PaymentAuthorizationVoided:
        $ref: '#/components/messages/PaymentAuthorizationVoided'
  paymentCaptured:
    address: powerbank.payment.paymentCaptured.v1
    description: Окончательное списание подтверждено.
    messages:
      PaymentCaptured:
        $ref: '#/components/messages/PaymentCaptured'
  paymentCaptureFailed:
    address: powerbank.payment.paymentCaptureFailed.v1
    description: Окончательное списание отклонено.
    messages:
      PaymentCaptureFailed:
        $ref: '#/components/messages/PaymentCaptureFailed'
  powerbankReleased:
    address: powerbank.station.powerbankReleased.v1
    description: Физическая станция достоверно подтвердила выдачу.
    messages:
      PowerbankReleased:
        $ref: '#/components/messages/PowerbankReleased'
  powerbankReleaseFailed:
    address: powerbank.station.powerbankReleaseFailed.v1
    description: Станция достоверно подтвердила, что устройство НЕ выдано.
    messages:
      PowerbankReleaseFailed:
        $ref: '#/components/messages/PowerbankReleaseFailed'
  powerbankReleaseUncertain:
    address: powerbank.station.powerbankReleaseUncertain.v1
    description: Исход выдачи неизвестен — нельзя автоматически отменить блокировку/резерв.
    messages:
      PowerbankReleaseUncertain:
        $ref: '#/components/messages/PowerbankReleaseUncertain'
  powerbankReturned:
    address: powerbank.station.powerbankReturned.v1
    description: Станция достоверно приняла возвращённое устройство.
    messages:
      PowerbankReturned:
        $ref: '#/components/messages/PowerbankReturned'
  rentalStarted:
    address: powerbank.rental.rentalStarted.v1
    description: Аренда перешла в ACTIVE после физической выдачи.
    messages:
      RentalStarted:
        $ref: '#/components/messages/RentalStarted'
  rentalCompleted:
    address: powerbank.rental.rentalCompleted.v1
    description: Возврат и единственное списание подтверждены.
    messages:
      RentalCompleted:
        $ref: '#/components/messages/RentalCompleted'
  rentalCancelled:
    address: powerbank.rental.rentalCancelled.v1
    description: Резерв освобождён и блокировка снята, выдачи не было.
    messages:
      RentalCancelled:
        $ref: '#/components/messages/RentalCancelled'
